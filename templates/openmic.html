<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Mic Registration</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#020617,#0f172a,#111827);
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:650px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(15px);

    border-radius:28px;

    padding:35px 25px;

    box-shadow:0 20px 50px rgba(0,0,0,0.4);
}

.badge{
    display:inline-block;

    padding:10px 18px;

    background:#ec4899;

    border-radius:50px;

    font-weight:bold;

    margin-bottom:25px;
}

h1{
    font-size:42px;

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Karaoke Draw</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Poppins',sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #020617,
                    #111827,
                    #1e293b
                );

            color:white;

            min-height:100vh;

            padding:30px;
        }

        .container{

            max-width:1200px;
            margin:auto;
        }

        .top{

            display:grid;

            grid-template-columns:
                420px 1fr;

            gap:30px;
        }

        @media(max-width:900px){

            .top{

                grid-template-columns:1fr;
            }
        }

        .card{

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius:30px;

            padding:35px;

            backdrop-filter:blur(14px);
        }

        h1{

            font-size:42px;

            margin-bottom:10px;

            background:
                linear-gradient(
                    to right,
                    #38bdf8,
                    #a855f7
                );

            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .subtitle{

            color:#94a3b8;

            margin-bottom:30px;
        }

        select{

            width:100%;

            height:60px;

            border:none;

            border-radius:18px;

            padding:0 20px;

            font-size:18px;

            background:#0f172a;

            color:white;

            margin-bottom:20px;

            outline:none;
        }

        button{

            width:100%;

            height:60px;

            border:none;

            border-radius:18px;

            font-size:18px;

            font-weight:600;

            cursor:pointer;

            background:
                linear-gradient(
                    135deg,
                    #06b6d4,
                    #9333ea
                );

            color:white;

            transition:0.3s;
        }

        button:hover{

            transform:translateY(-3px);
        }

        .result{

            margin-top:30px;

            text-align:center;
        }

        .slot-container{

            display:flex;

            justify-content:center;

            flex-wrap:wrap;

            gap:14px;

            margin-top:20px;
        }

        .slot{

            width:70px;
            height:70px;

            border-radius:20px;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:24px;
            font-weight:700;

            background:
                linear-gradient(
                    135deg,
                    #38bdf8,
                    #8b5cf6
                );
        }

        .public-title{

            font-size:28px;

            margin-bottom:25px;
        }

        .public-list{

            display:grid;

            gap:18px;
        }

        .public-card{

            background:
                rgba(255,255,255,0.04);

            border:
                1px solid rgba(255,255,255,0.06);

            border-radius:20px;

            padding:20px;
        }

        .public-name{

            font-size:20px;
            font-weight:600;

            margin-bottom:15px;

            text-transform:capitalize;
        }

        .public-slots{

            display:flex;
            flex-wrap:wrap;
            gap:10px;
        }

        .mini-slot{

            width:48px;
            height:48px;

            border-radius:14px;

            display:flex;
            align-items:center;
            justify-content:center;

            font-weight:700;

            background:#7c3aed;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="top">

            <!-- DRAW BOX -->

            <div class="card">

                <h1>🎤 Karaoke Draw</h1>

                <div class="subtitle">
                    Select your name and draw your slot
                </div>

                <form method="POST">

                    <select
                        name="singer"
                        required
                    >

                        <option value="">
                            Select Singer
                        </option>

                        {% for singer in singers %}

                            <option value="{{ singer }}">
                                {{ singer.title() }}
                            </option>

                        {% endfor %}

                    </select>

                    <button type="submit">
                        🎲 Draw My Slot
                    </button>

                </form>

                {% if result %}

                    <div class="result">

                        <h2>
                            {{ result.singer.title() }}
                        </h2>

                        <div class="slot-container">

                            {% for slot in result.slots %}

                                <div class="slot">
                                    {{ slot }}
                                </div>

                            {% endfor %}

                        </div>

                    </div>

                {% endif %}

            </div>

            <!-- PUBLIC DRAW LIST -->

            <div class="card">

                <div class="public-title">
                    📢 Public Draw Results
                </div>

                <div class="public-list">

                    {% for item in draw_data %}

                        <div class="public-card">

                            <div class="public-name">
                                {{ item.singer }}
                            </div>

                            <div class="public-slots">

                                {% for slot in item.slots %}

                                    <div class="mini-slot">
                                        {{ slot }}
                                    </div>

                                {% endfor %}

                            </div>

                        </div>

                    {% endfor %}

                </div>

            </div>

        </div>

    </div>

</body>

</html>

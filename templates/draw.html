<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Live Karaoke Draw</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Poppins',sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #020617,
                    #0f172a,
                    #111827
                );

            color:white;

            min-height:100vh;

            overflow-x:hidden;
        }

        .container{

            max-width:1000px;
            margin:auto;

            padding:40px 20px;
        }

        .title{

            text-align:center;

            margin-bottom:60px;
        }

        .title h1{

            font-size:56px;

            background:
                linear-gradient(
                    to right,
                    #38bdf8,
                    #a855f7
                );

            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .title p{

            color:#94a3b8;

            margin-top:10px;
        }

        .draw-box{

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius:30px;

            padding:50px;

            text-align:center;

            backdrop-filter:blur(14px);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.4);
        }

        .singer{

            font-size:40px;
            font-weight:700;

            margin-bottom:40px;

            text-transform:capitalize;
        }

        .slot{

            width:140px;
            height:140px;

            margin:auto;

            border-radius:30px;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:58px;
            font-weight:700;

            background:
                linear-gradient(
                    135deg,
                    #06b6d4,
                    #9333ea
                );

            box-shadow:
                0 20px 40px rgba(147,51,234,0.4);

            animation:
                pulse 1s infinite;
        }

        @keyframes pulse{

            0%{
                transform:scale(1);
            }

            50%{
                transform:scale(1.08);
            }

            100%{
                transform:scale(1);
            }
        }

        .done{

            margin-top:50px;

            display:grid;

            grid-template-columns:
                repeat(auto-fit,minmax(260px,1fr));

            gap:20px;
        }

        .done-card{

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius:20px;

            padding:20px;
        }

        .done-name{

            font-size:20px;
            margin-bottom:12px;

            text-transform:capitalize;
        }

        .done-slots{

            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }

        .mini-slot{

            width:42px;
            height:42px;

            border-radius:12px;

            display:flex;
            align-items:center;
            justify-content:center;

            background:#8b5cf6;

            font-weight:700;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="title">

            <h1>🎤 Live Karaoke Draw</h1>

            <p>
                Official Random Slot Selection
            </p>

        </div>

        <div class="draw-box">

            <div
                class="singer"
                id="singer"
            >
                Preparing Draw...
            </div>

            <div
                class="slot"
                id="slot"
            >
                🎵
            </div>

        </div>

        <div
            class="done"
            id="done"
        ></div>

    </div>

    <script>

        const drawData = {{ draw_data | tojson }};

        let singerIndex = 0;

        let slotIndex = 0;

        let currentSlots = [];

        let collected = [];

        function nextDraw(){

            if(singerIndex >= drawData.length){

                document.getElementById(
                    "singer"
                ).innerHTML = "✅ Draw Completed";

                document.getElementById(
                    "slot"
                ).innerHTML = "🎉";

                return;
            }

            const singerData =
                drawData[singerIndex];

            document.getElementById(
                "singer"
            ).innerHTML =
                singerData.singer;

            currentSlots =
                singerData.slots;

            revealSlot();
        }

        function revealSlot(){

            if(slotIndex >= currentSlots.length){

                collected.push({
                    singer:
                        drawData[singerIndex].singer,
                    slots:
                        currentSlots
                });

                renderCompleted();

                singerIndex++;

                slotIndex = 0;

                setTimeout(
                    nextDraw,
                    1500
                );

                return;
            }

            let counter = 0;

            const animation =
                setInterval(()=>{

                document.getElementById(
                    "slot"
                ).innerHTML =
                    Math.floor(
                        Math.random()*31
                    ) + 1;

                counter++;

                if(counter > 20){

                    clearInterval(animation);

                    document.getElementById(
                        "slot"
                    ).innerHTML =
                        currentSlots[slotIndex];

                    slotIndex++;

                    setTimeout(
                        revealSlot,
                        1200
                    );
                }

            },80);
        }

        function renderCompleted(){

            const done =
                document.getElementById(
                    "done"
                );

            done.innerHTML = "";

            collected.forEach(item=>{

                done.innerHTML += `
                    <div class="done-card">

                        <div class="done-name">
                            ${item.singer}
                        </div>

                        <div class="done-slots">

                            ${item.slots.map(
                                s=>`
                                    <div class="mini-slot">
                                        ${s}
                                    </div>
                                `
                            ).join("")}

                        </div>

                    </div>
                `;
            });
        }

        nextDraw();

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Draw</title>

    <style>

        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:linear-gradient(135deg,#000428,#004e92);
            color:white;
            text-align:center;
        }
        /* PREMIUM BRANDING */

.powered-section{

    margin:60px 20px;

    padding:50px 25px;

    border-radius:28px;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #111827,
        #1e293b
    );

    border:2px solid rgba(56,189,248,0.25);

    text-align:center;

    box-shadow:
    0 20px 60px rgba(0,0,0,0.45),
    0 0 40px rgba(56,189,248,0.12);

}

.powered-text{

    font-size:22px;

    letter-spacing:5px;

    color:#94a3b8;

    margin-bottom:20px;

    font-weight:600;
}

.brand-link{

    display:inline-block;

    font-size:56px;

    font-weight:900;

    text-decoration:none;

    background:linear-gradient(
        135deg,
        #38bdf8,
        #9333ea,
        #ec4899
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    margin-bottom:20px;

    transition:0.35s;

    font-family:Arial,sans-serif;

    text-shadow:
    0 0 25px rgba(56,189,248,0.25);
}

.brand-link:hover{

    transform:scale(1.06);
}

.brand-subtitle{

    color:#e2e8f0;

    font-size:18px;

    line-height:2;

    max-width:700px;

    margin:auto;
}

/* MOBILE */

@media(max-width:600px){

    .powered-section{

        padding:40px 18px;
    }

    .brand-link{

        font-size:34px;
    }

    .powered-text{

        font-size:16px;

        letter-spacing:3px;
    }

    .brand-subtitle{

        font-size:14px;

        line-height:1.8;
    }
}

        h1{
            margin-top:20px;
        }

        .card{
            background:white;
            color:black;
            margin:20px;
            padding:20px;
            border-radius:15px;
        }

        select,button{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:8px;
            font-size:16px;
        }

        button{
            background:#ff5722;
            color:white;
            font-weight:bold;
        }

        .result{
            margin-top:15px;
            font-size:18px;
            color:#ffeb3b;
            font-weight:bold;
        }

        table{
            width:95%;
            margin:auto;
            background:white;
            color:black;
            border-collapse:collapse;
            border-radius:10px;
            overflow:hidden;
        }

        th,td{
            padding:10px;
            border-bottom:1px solid #ddd;
        }

        th{
            background:#004e92;
            color:white;
        }

    </style>
</head>
<body>

<h1>🎤 Karaoke Draw System</h1>

<div class="card">

    <form method="POST">

        <select name="name" required>

            <option value="">Select Singer</option>

            {% for singer, songs in singers.items() %}
                <option value="{{ singer }}">
                    {{ singer }} ({{ songs }} songs)
                </option>
            {% endfor %}

        </select>

        <button type="submit">
            🎲 Draw Slots
        </button>

    </form>

    {% if result %}
        <div class="result">
            {{ result }}
        </div>
    {% endif %}

</div>

<table>

    <tr>
        <th>Singer</th>
        <th>Slot</th>
    </tr>

    {% for item in data %}
    <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.slot }}</td>
    </tr>
    {% endfor %}

</table>
<div class="powered-section">

    <div class="powered-text">
        ⚡ POWERED BY
    </div>

    <a 
        href="https://bhadreshtech.site/" 
        target="_blank"
        class="brand-link"
    >
        🚀 BHADRESH TECH
    </a>

    <div class="brand-subtitle">
        Modern Websites • Telegram Bots • AI Automation • 
        Event Systems • Cloud Hosting • Business Solutions
    </div>

</div>
</body>
</html>

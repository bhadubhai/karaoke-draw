<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Karaoke Slot Draw</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Poppins',sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #020617,
                    #111827,
                    #1e293b
                );

            min-height:100vh;

            display:flex;
            align-items:center;
            justify-content:center;

            padding:20px;

            color:white;
        }

        .card{

            width:100%;
            max-width:550px;

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid rgba(255,255,255,0.08);

            backdrop-filter:blur(16px);

            border-radius:30px;

            padding:40px;
        }

        h1{

            text-align:center;

            font-size:38px;

            margin-bottom:10px;

            background:
                linear-gradient(
                    to right,
                    #38bdf8,
                    #a855f7
                );

            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .subtitle{

            text-align:center;

            color:#94a3b8;

            margin-bottom:35px;
        }

        select{

            width:100%;

            height:60px;

            border:none;

            outline:none;

            border-radius:18px;

            padding:0 20px;

            font-size:18px;

            background:#0f172a;

            color:white;

            margin-bottom:25px;
        }

        button{

            width:100%;

            height:60px;

            border:none;

            border-radius:18px;

            font-size:18px;

            font-weight:600;

            cursor:pointer;

            background:
                linear-gradient(
                    135deg,
                    #06b6d4,
                    #9333ea
                );

            color:white;

            transition:0.3s;
        }

        button:hover{

            transform:translateY(-3px);
        }

        .result{

            margin-top:35px;

            text-align:center;
        }

        .slot-box{

            display:flex;

            justify-content:center;

            gap:15px;

            flex-wrap:wrap;

            margin-top:20px;
        }

        .slot{

            width:70px;
            height:70px;

            border-radius:20px;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:24px;
            font-weight:700;

            background:
                linear-gradient(
                    135deg,
                    #38bdf8,
                    #8b5cf6
                );
        }

        .success{

            color:#4ade80;

            margin-top:15px;
        }

    </style>

</head>

<body>

    <div class="card">

        <h1>🎤 Karaoke Draw</h1>

        <div class="subtitle">
            Select your name and draw your slot
        </div>

        <form method="POST">

            <select name="singer" required>

                <option value="">
                    Select Singer
                </option>

                {% for singer in singers %}

                    <option value="{{ singer }}">
                        {{ singer.title() }}
                    </option>

                {% endfor %}

            </select>

            <button type="submit">
                🎲 Draw My Slot
            </button>

        </form>

        {% if result %}

            <div class="result">

                <h2>
                    {{ result.singer.title() }}
                </h2>

                <div class="slot-box">

                    {% for slot in result.slots %}

                        <div class="slot">
                            {{ slot }}
                        </div>

                    {% endfor %}

                </div>

                <div class="success">
                    Slot Assigned Successfully ✅
                </div>

            </div>

        {% endif %}

    </div>

</body>

</html>

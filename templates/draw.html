<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Karaoke Draw</title>

    <!-- GOOGLE FONT -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {

            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: 'Poppins', sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #111827,
                    #1e293b
                );

            min-height: 100vh;

            color: white;

            padding: 40px 20px;
        }

        .container {

            max-width: 1200px;
            margin: auto;
        }

        .header {

            text-align: center;
            margin-bottom: 50px;
        }

        .badge {

            display: inline-block;

            padding:
                10px 20px;

            border-radius: 50px;

            background:
                rgba(255,255,255,0.08);

            backdrop-filter: blur(10px);

            border:
                1px solid rgba(255,255,255,0.1);

            font-size: 14px;

            letter-spacing: 1px;

            margin-bottom: 20px;

            color: #38bdf8;
        }

        h1 {

            font-size: 52px;
            font-weight: 700;

            margin-bottom: 15px;

            background:
                linear-gradient(
                    to right,
                    #38bdf8,
                    #a855f7
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {

            color: #cbd5e1;
            font-size: 18px;
        }

        .grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(300px, 1fr)
                );

            gap: 25px;
        }

        .card {

            position: relative;

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 24px;

            padding: 28px;

            overflow: hidden;

            backdrop-filter: blur(16px);

            transition: 0.3s ease;
        }

        .card:hover {

            transform:
                translateY(-8px);

            border-color:
                rgba(56,189,248,0.5);

            box-shadow:
                0 20px 40px rgba(0,0,0,0.4);
        }

        .glow {

            position: absolute;

            width: 180px;
            height: 180px;

            background:
                radial-gradient(
                    circle,
                    rgba(168,85,247,0.25),
                    transparent 70%
                );

            top: -80px;
            right: -80px;
        }

        .singer-name {

            font-size: 24px;
            font-weight: 600;

            margin-bottom: 22px;

            text-transform: capitalize;

            color: white;
        }

        .slot-label {

            font-size: 14px;

            color: #94a3b8;

            margin-bottom: 12px;

            letter-spacing: 1px;
        }

        .slots {

            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .slot {

            width: 52px;
            height: 52px;

            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: 700;
            font-size: 18px;

            background:
                linear-gradient(
                    135deg,
                    #38bdf8,
                    #8b5cf6
                );

            color: white;

            box-shadow:
                0 10px 20px rgba(56,189,248,0.25);
        }

        .footer {

            text-align: center;

            margin-top: 60px;

            color: #94a3b8;

            font-size: 14px;
        }

        @media(max-width: 768px) {

            h1 {

                font-size: 38px;
            }

            .subtitle {

                font-size: 16px;
            }

            .card {

                padding: 22px;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <!-- HEADER -->

        <div class="header">

            <div class="badge">
                🎤 LIVE KARAOKE EVENT
            </div>

            <h1>Karaoke Draw System</h1>

            <div class="subtitle">
                Official Singer Slot Allocation
            </div>

        </div>

        <!-- GRID -->

        <div class="grid">

            {% for item in draw_data %}

                <div class="card">

                    <div class="glow"></div>

                    <div class="singer-name">
                        {{ item.singer }}
                    </div>

                    <div class="slot-label">
                        PERFORMANCE SLOTS
                    </div>

                    <div class="slots">

                        {% for slot in item.slots %}

                            <div class="slot">
                                {{ slot }}
                            </div>

                        {% endfor %}

                    </div>

                </div>

            {% endfor %}

        </div>

        <!-- FOOTER -->

        <div class="footer">

            Powered By Karaoke Management System

        </div>

    </div>

</body>

</html>

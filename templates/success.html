<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registration Successful</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    font-family:'Poppins',sans-serif;

    background:
    radial-gradient(circle at top,
    rgba(34,197,94,0.25),
    transparent 30%),

    radial-gradient(circle at bottom right,
    rgba(14,165,233,0.25),
    transparent 30%),

    linear-gradient(
        135deg,
        #020617,
        #0f172a,
        #111827
    );

    color:white;
}

.box{

    width:100%;

    max-width:700px;

    text-align:center;

    background:
    rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);

    border-radius:34px;

    padding:50px 30px;

    box-shadow:
    0 25px 70px rgba(0,0,0,0.45);
}

.icon{

    font-size:90px;

    margin-bottom:25px;

    animation:pop 1.5s infinite;
}

h1{

    font-size:52px;

    margin-bottom:22px;

    font-family:'Orbitron',sans-serif;

    background:
    linear-gradient(
        135deg,
        #22c55e,
        #38bdf8
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.subtitle{

    color:#cbd5e1;

    line-height:2;

    font-size:18px;

    margin-bottom:35px;
}

.info{

    background:
    rgba(34,197,94,0.08);

    border:1px solid rgba(34,197,94,0.15);

    padding:24px;

    border-radius:24px;

    margin-bottom:35px;
}

.info h3{

    color:#22c55e;

    margin-bottom:12px;

    font-size:28px;
}

.info p{

    color:#dcfce7;

    line-height:1.9;
}

.live-btn{

    display:inline-block;

    padding:18px 30px;

    border-radius:18px;

    text-decoration:none;

    color:white;

    font-weight:700;

    background:
    linear-gradient(
        135deg,
        #ff0000,
        #ff4d4d
    );

    box-shadow:
    0 15px 35px rgba(255,0,0,0.3);

    margin-top:10px;
}

.powered{

    margin-top:40px;

    color:#94a3b8;
}

.powered a{

    color:#38bdf8;

    text-decoration:none;

    font-weight:700;
}

@keyframes pop{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }

    100%{
        transform:scale(1);
    }
}

@media(max-width:700px){

    h1{
        font-size:34px;
    }

    .subtitle{
        font-size:16px;
    }

    .info h3{
        font-size:22px;
    }
}

</style>
</head>
<body>

<div class="box">

<div class="icon">
✅
</div>

<h1>
PAYMENT SUCCESSFUL
</h1>

<div class="subtitle">

🎉 Your Kids Open Mic registration has been successfully completed.

Thank you for participating in the Organizer Birthday Special Event.

</div>

<div class="info">

<h3>
🎤 EVENT DETAILS
</h3>

<p>

📅 Date: 02/06/2026<br><br>

📍 Venue:<br>
Evening Post, Kasturba Road, Rajkot, Gujarat

</p>

</div>

<a
href="https://youtube.com/@bhadreshlivemedia"
target="_blank"
class="live-btn"
>
▶ FOLLOW LIVE STREAM
</a>

<div class="powered">

Powered By

<a href="https://bhadreshtech.site/" target="_blank">
Bhadresh Tech
</a>

</div>

</div>

</body>
</html>
